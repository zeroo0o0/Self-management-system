<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.toggle('dark',localStorage.getItem('_theme')==='dark')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分商城</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">🌱 导航</span>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-nav">
      <a class="sidebar-item" href="index.html"><span class="si-icon">🏠</span> 首页</a>
      <a class="sidebar-item" href="todo.html"><span class="si-icon">📋</span> 待办事项</a>
      <a class="sidebar-item active" href="shop.html"><span class="si-icon">🏪</span> 积分商城</a>
      <a class="sidebar-item" href="bilibili.html"><span class="si-icon">📺</span> Bilibili 课程</a>
      <a class="sidebar-item" href="turntable.html"><span class="si-icon">🎡</span> 幸运转盘</a>
      <a class="sidebar-item" href="stats.html"><span class="si-icon">📊</span> 数据统计</a>
    </div>
  </div>

  <div id="app" v-cloak>
    <a class="back" href="index.html">← 返回首页</a>

    <div class="shop-header">
      <div class="shop-title-row">
        <h1>🏪 积分商城</h1>
        <button class="shop-refresh-btn" @click="onRefresh" title="刷新商品">🔄</button>
      </div>
      <div class="shop-balance">
        <div class="shop-points-display">
          <span class="shop-points-icon"><img src="images/credits/%E7%A7%AF%E5%88%86-%E9%AB%98%E6%B8%85%E7%89%88%E9%80%8F%E6%98%8E.png" class="pts-icon-lg"></span>
          <span class="shop-points-num">{{ points }}</span>
          <span class="shop-points-label">积分</span>
        </div>
        <div class="shop-total">累计获得 {{ totalEarned }} 积分</div>
      </div>
    </div>

    <!-- Toast -->
    <div class="shop-toast" v-if="toastMsg">{{ toastMsg }}</div>

    <!-- 加载中 -->
    <div class="shop-loading" v-if="loading">
      <p>加载中...</p>
    </div>

    <template v-if="!loading">
      <!-- 商品列表 -->
      <div class="shop-items-grid" v-if="shopItems.length > 0">
        <div class="shop-item-card" v-for="item in shopItems" :key="item.name + item.cost">
          <div class="shop-item-icon">{{ item.icon }}</div>
          <div class="shop-item-info">
            <div class="shop-item-name">{{ item.name }}</div>
            <div class="shop-item-desc">{{ item.desc }}</div>
          </div>
          <div class="shop-item-bottom">
            <span class="shop-item-cost"><img src="images/credits/%E7%A7%AF%E5%88%86-%E9%AB%98%E6%B8%85%E7%89%88%E9%80%8F%E6%98%8E.png" class="pts-icon-sm"> {{ item.cost }}</span>
            <button class="shop-buy-btn" @click="buyItem(item)"
                    :disabled="points < item.cost">兑换</button>
          </div>
        </div>
      </div>
      <div class="shop-empty" v-else>
        <p>🎉 商品已售罄！点击右上角 🔄 刷新</p>
      </div>

      <!-- 兑换记录 -->
      <div class="shop-history-section" v-if="purchasedHistory.length > 0">
        <h3>📜 兑换记录</h3>
        <div class="shop-history-list">
          <div class="shop-history-item" v-for="(h, i) in purchasedHistory" :key="i">
            <span class="shop-h-icon">{{ h.icon }}</span>
            <span class="shop-h-name">{{ h.name }}</span>
            <span class="shop-h-cost">-<img src="images/credits/%E7%A7%AF%E5%88%86-%E9%AB%98%E6%B8%85%E7%89%88%E9%80%8F%E6%98%8E.png" class="pts-icon-sm">{{ h.cost }}</span>
            <span class="shop-h-time">{{ h.boughtAt }}</span>
          </div>
        </div>
      </div>
    </template>

    <footer>
      <button class="theme-toggle" onclick="var d=document.documentElement;d.classList.toggle('dark');localStorage.setItem('_theme',d.classList.contains('dark')?'dark':'light')" title="切换主题"><span class="tt-moon">🌙</span><span class="tt-sun">☀️</span></button>
      <p class="footer-note">🎯 完成待办 · 深度学习 → 赚取积分</p>
    </footer>
  </div>
  <script>function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open'),document.getElementById('sidebarOverlay').classList.toggle('active')}</script>
  <script src="shop.js"></script>
</body>
</html>
