<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.toggle('dark',localStorage.getItem('_theme')==='dark')</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自我管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">🌱 导航</span>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="sidebar-nav">
      <a class="sidebar-item active" href="index.html"><span class="si-icon">🏠</span> 首页</a>
      <a class="sidebar-item" href="todo.html"><span class="si-icon">📋</span> 待办事项</a>
      <a class="sidebar-item" href="shop.html"><span class="si-icon">🏪</span> 积分商城</a>
      <a class="sidebar-item" href="turntable.html"><span class="si-icon">🎡</span> 幸运转盘</a>
      <a class="sidebar-item" href="stats.html"><span class="si-icon">📊</span> 数据统计</a>
    </div>
  </div>

  <!-- ====== 全屏英雄区 ====== -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>

    <!-- 语录管理入口 -->
    <button class="hero-settings" onclick="openQuoteManager()" title="管理语录">⚙️</button>

    <div class="hero-content">
      <h1 class="hero-title">🌱 自我管理系统</h1>
      <p class="hero-subtitle">今天也要好好成长 ✨</p>

      <div class="hero-quotes" id="hero-quotes">
        <div class="hero-quote" v-for="i in 3"><!-- JS 动态渲染 --></div>
      </div>
    </div>

    <div class="hero-scroll-hint">
      <span>继续探索</span>
      <div class="scroll-arrow">↓</div>
    </div>
  </section>

  <!-- ====== 主页面内容 ====== -->
  <main class="main-content">
    <div class="card-grid">
      <a class="card" href="todo.html">
        <span class="card-icon">📋</span>
        <span class="card-title">待办事项</span>
        <span class="card-desc">管理每日任务，按优先级排序</span>
      </a>

      <a class="card" href="shop.html">
        <span class="card-icon">🏪</span>
        <span class="card-title">积分商城</span>
        <span class="card-desc">用积分兑换奖励，深度学习与完成任务赚积分</span>
      </a>

      <a class="card" href="turntable.html">
        <span class="card-icon">🎡</span>
        <span class="card-title">幸运转盘</span>
        <span class="card-desc">完成任务赢取抽奖机会，奖励自己</span>
      </a>

      <a class="card" href="stats.html">
        <span class="card-icon">📊</span>
        <span class="card-title">数据统计</span>
        <span class="card-desc">查看一周成长趋势与完成情况</span>
      </a>
    </div>

    <!-- ====== Bilibili 课程导入模块 ====== -->
    <section class="bili-section">
      <h2 class="bili-title">📺 Bilibili 课程导入</h2>
      <div class="bili-input-row">
        <input type="text" id="biliUrl" class="bili-input"
               placeholder="粘贴 Bilibili 合集链接，如 https://space.bilibili.com/1567748478/lists/358497?type=series">
        <button class="bili-fetch-btn" onclick="fetchBiliSeries()" id="biliFetchBtn">📥 获取列表</button>
      </div>
      <div id="biliError" class="bili-error" style="display:none"></div>
      <div id="biliLoading" class="bili-loading" style="display:none">⏳ 加载中...</div>
      <div id="biliResult" class="bili-result"></div>
    </section>

    <footer>
      <div class="footer-links">
        <a class="repo-link" href="https://github.com/zeroo0o0/Self-management-system" target="_blank" rel="noopener"><span>https://github.com/zeroo0o0/Self-management-system</span></a>
      </div>
      <p class="footer-note">💾 数据按模块分目录存储 · 换设备拷贝 <code>data/</code> 即可迁移</p>
    </footer>
  </main>

  <!-- ====== 语录管理弹窗 ====== -->
  <div class="quote-overlay" id="quote-overlay" onclick="closeQuoteManager(event)">
    <div class="quote-modal">
      <div class="quote-modal-header">
        <span class="quote-modal-title">📖 管理语录</span>
        <button class="quote-close-btn" onclick="closeQuoteManager()">✕</button>
      </div>

      <div class="quote-add-row">
        <input type="text" id="quote-text-input" placeholder="输入语录内容..." class="quote-input">
        <input type="text" id="quote-author-input" placeholder="出处（留空则不显示）" class="quote-author-input">
        <button onclick="addQuote()">添加</button>
      </div>

      <div class="quote-list" id="quote-list">
        <!-- JS 动态渲染 -->
      </div>
    </div>
  </div>

  <button class="theme-toggle" onclick="var d=document.documentElement;d.classList.toggle('dark');localStorage.setItem('_theme',d.classList.contains('dark')?'dark':'light')" title="切换主题"><span class="tt-moon">🌙</span><span class="tt-sun">☀️</span></button>

  <script>
    // ====== 加载并显示 3 条随机语录 ======
    let quotesData = []

    async function loadQuotes() {
      try {
        const res = await fetch('/api/quotes')
        const data = await res.json()
        quotesData = data.quotes || []
        renderQuotes()
      } catch (e) {
        console.error('加载语录失败:', e)
      }
    }

    function renderQuotes() {
      const container = document.getElementById('hero-quotes')
      if (!container) return
      // 随机选 3 条
      const shuffled = [...quotesData].sort(() => Math.random() - 0.5)
      const selected = shuffled.slice(0, 3)
      if (selected.length === 0) {
        container.innerHTML = '<div class="hero-quote"><div class="quote-text">还没有语录，点击右上角 ⚙️ 添加</div></div>'
        return
      }
      container.innerHTML = selected.map(q => `
        <div class="hero-quote">
          <div class="quote-mark">"</div>
          <div class="quote-text">${escapeHtml(q.text)}</div>
          ${q.author && q.author !== '匿名' ? `<div class="quote-author">—— ${escapeHtml(q.author)}</div>` : '<div class="quote-author qa-empty">—— 未标注出处</div>'}
        </div>
      `).join('')
    }

    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    // ====== 语录管理 ======
    function openQuoteManager() {
      document.getElementById('quote-overlay').classList.add('active')
      document.body.style.overflow = 'hidden'
      renderQuoteList()
    }

    function closeQuoteManager(e) {
      if (e && e.target !== e.currentTarget) return
      document.getElementById('quote-overlay').classList.remove('active')
      document.body.style.overflow = ''
    }

    async function renderQuoteList() {
      const list = document.getElementById('quote-list')
      if (!list) return
      if (quotesData.length === 0) {
        list.innerHTML = '<div class="quote-empty">还没有语录，在上方添加吧</div>'
        return
      }
      list.innerHTML = quotesData.map(q => `
        <div class="quote-list-item">
          <div class="quote-list-text">
            <span class="quote-list-content" onclick="editQuoteInList(this, ${q.id})" title="单击编辑">${escapeHtml(q.text)}</span>
            <span class="quote-list-author ${q.author && q.author !== '匿名' ? '' : 'qa-empty'}" onclick="editAuthorInList(this, ${q.id})" title="单击编辑出处">—— ${q.author && q.author !== '匿名' ? escapeHtml(q.author) : '未标注出处'}</span>
          </div>
          <button class="btn-icon" onclick="deleteQuote(${q.id})" title="删除">✕</button>
        </div>
      `).join('')
    }

    // ====== 管理弹窗：语录内联编辑 ======
    function editQuoteInList(el, id) {
      if (el.querySelector('input')) return
      const oldText = el.textContent
      const input = document.createElement('input')
      input.type = 'text'
      input.className = 'quote-list-edit-input'
      input.value = oldText
      el.textContent = ''
      el.appendChild(input)
      input.focus()
      input.select()

      function finish(save) {
        const val = input.value.trim()
        if (save && val && val !== oldText) {
          updateQuoteInList(id, val, el)
        } else {
          el.textContent = oldText
        }
      }

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true) }
        if (e.key === 'Escape') { e.preventDefault(); finish(false) }
      })
      input.addEventListener('blur', () => finish(true))
    }

    async function updateQuoteInList(id, text, el, author) {
      try {
        const body = { text }
        if (author !== undefined) body.author = author
        const res = await fetch('/api/quotes/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
        const data = await res.json()
        if (data.ok) {
          quotesData = data.quotes
          el.textContent = text
          renderQuotes()
          renderQuoteList()
        } else {
          el.textContent = text
        }
      } catch (e) {
        console.error('更新语录失败:', e)
        el.textContent = text
      }
    }

    // 出处内联编辑
    function editAuthorInList(el, id) {
      if (el.querySelector('input')) return
      const match = el.textContent.match(/——\s*(.*)/)
      const oldVal = match ? match[1] : ''
      const input = document.createElement('input')
      input.type = 'text'
      input.className = 'quote-list-edit-input'
      input.value = oldVal === '未标注出处' ? '' : oldVal
      input.placeholder = '出处（留空则不显示）'
      el.textContent = ''
      el.appendChild(input)
      input.focus()
      input.select()

      function finish(save) {
        const val = input.value.trim()
        if (save && val !== oldVal && (val || oldVal !== '')) {
          updateAuthorInList(id, val, el)
        } else {
          el.textContent = '—— ' + (oldVal || '未标注出处')
        }
      }

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true) }
        if (e.key === 'Escape') { e.preventDefault(); finish(false) }
      })
      input.addEventListener('blur', () => finish(true))
    }

    async function updateAuthorInList(id, author, el) {
      try {
        const res = await fetch('/api/quotes/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author })
        })
        const data = await res.json()
        if (data.ok) {
          quotesData = data.quotes
          renderQuotes()
          renderQuoteList()
        } else {
          el.textContent = '—— ' + (author || '未标注出处')
        }
      } catch (e) {
        console.error('更新出处失败:', e)
        el.textContent = '—— ' + (author || '未标注出处')
      }
    }

    async function addQuote() {
      const textInput = document.getElementById('quote-text-input')
      const authorInput = document.getElementById('quote-author-input')
      const text = textInput.value.trim()
      if (!text) { alert('请输入语录内容'); return }
      try {
        const res = await fetch('/api/quotes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, author: authorInput.value.trim() })
        })
        const data = await res.json()
        if (data.ok) {
          quotesData = data.quotes
          textInput.value = ''
          authorInput.value = ''
          renderQuoteList()
          renderQuotes()
        }
      } catch (e) {
        console.error('添加失败:', e)
      }
    }

    async function deleteQuote(id) {
      if (!confirm('确定删除这条语录？')) return
      try {
        const res = await fetch('/api/quotes/' + id, { method: 'DELETE' })
        const data = await res.json()
        if (data.ok) {
          quotesData = data.quotes
          renderQuoteList()
          renderQuotes()
        }
      } catch (e) {
        console.error('删除失败:', e)
      }
    }

    // ====== 滚动时给 hero 添加阴影效果 ======
    window.addEventListener('scroll', () => {
      const hero = document.getElementById('hero')
      if (window.scrollY > 80) {
        hero.classList.add('hero-scrolled')
      } else {
        hero.classList.remove('hero-scrolled')
      }
    })

    // ====== 背景图片随机选取 ======
    async function loadRandomBackground() {
      try {
        const res = await fetch('/api/backgrounds')
        const data = await res.json()
        const list = data.backgrounds || []
        if (list.length > 0) {
          const pick = list[Math.floor(Math.random() * list.length)]
          document.querySelector('.hero-bg').style.backgroundImage = "url('images/background/" + pick + "')"
        }
      } catch (e) {
        console.error('加载背景图片失败:', e)
      }
    }

    // ====== 侧边栏 ======
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open'),document.getElementById('sidebarOverlay').classList.toggle('active')}

    // ====== Bilibili 课程导入 ======
    function getBiliWatched(seriesId) {
      try { return JSON.parse(localStorage.getItem('_bili_' + seriesId)) || [] } catch(e) { return [] }
    }

    function saveBiliWatched(seriesId, arr) {
      localStorage.setItem('_bili_' + seriesId, JSON.stringify(arr))
    }

    function updateBiliCounter(seriesId) {
      const watched = getBiliWatched(seriesId)
      const items = document.querySelectorAll('.bili-video-item')
      const counter = document.getElementById('biliCounter')
      if (counter) counter.textContent = '✅ ' + watched.length + '/' + items.length
    }

    function toggleBili(el) {
      const seriesId = el.dataset.series
      const bvid = el.dataset.bvid
      const watched = getBiliWatched(seriesId)
      const idx = watched.indexOf(bvid)
      const item = el.closest('.bili-video-item')
      if (idx === -1) {
        watched.push(bvid)
        el.textContent = '✅'
        item.classList.add('bili-done')
      } else {
        watched.splice(idx, 1)
        el.textContent = '⬜'
        item.classList.remove('bili-done')
      }
      saveBiliWatched(seriesId, watched)
      updateBiliCounter(seriesId)
    }

    async function fetchBiliSeries() {
      const url = document.getElementById('biliUrl').value.trim()
      if (!url) return
      const errorEl = document.getElementById('biliError')
      const loadingEl = document.getElementById('biliLoading')
      const resultEl = document.getElementById('biliResult')
      const btn = document.getElementById('biliFetchBtn')
      errorEl.style.display = 'none'
      resultEl.innerHTML = ''
      loadingEl.style.display = 'block'
      btn.disabled = true
      try {
        const res = await fetch('/api/bilibili/series?url=' + encodeURIComponent(url))
        const data = await res.json()
        if (!data.ok) {
          errorEl.textContent = '❌ ' + data.error
          errorEl.style.display = 'block'
          return
        }
        if (data.videos.length === 0) {
          resultEl.innerHTML = '<div class="bili-empty">该合集暂无视频</div>'
          return
        }
        const seriesId = url.match(/\/lists\/(\d+)/)[1]
        const watched = getBiliWatched(seriesId)
        let html = '<div class="bili-meta">'
        html += '<span class="bili-series-name">📚 ' + escapeHtml(data.seriesName) + '</span>'
        html += '<span class="bili-counter" id="biliCounter">✅ ' + watched.length + '/' + data.videos.length + '</span>'
        html += '</div>'
        html += '<div class="bili-video-list">'
        data.videos.forEach(function(v) {
          var isWatched = watched.indexOf(v.bvid) !== -1
          html += '<div class="bili-video-item' + (isWatched ? ' bili-done' : '') + '">'
          html += '<span class="bili-cb" data-series="' + seriesId + '" data-bvid="' + v.bvid + '" onclick="toggleBili(this)">' + (isWatched ? '✅' : '⬜') + '</span>'
          html += '<span class="bili-video-title" title="' + escapeHtml(v.title) + '">' + escapeHtml(v.title) + '</span>'
          html += '<span class="bili-video-duration">' + v.durationText + '</span>'
          html += '</div>'
        })
        html += '</div>'
        if (data.videos.length > 0) {
          var totalSecs = data.videos.reduce(function(s, v) { return s + (v.duration || 0) }, 0)
          var totalH = Math.floor(totalSecs / 3600)
          var totalM = Math.floor((totalSecs % 3600) / 60)
          html += '<div class="bili-total-time">📆 总时长 ' + totalH + 'h' + totalM + 'm</div>'
        }
        resultEl.innerHTML = html
      } catch (e) {
        errorEl.textContent = '❌ 请求失败: ' + e.message
        errorEl.style.display = 'block'
      } finally {
        loadingEl.style.display = 'none'
        btn.disabled = false
      }
    }

    // Enter 键触发获取
    document.addEventListener('DOMContentLoaded', function() {
      var input = document.getElementById('biliUrl')
      if (input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { e.preventDefault(); fetchBiliSeries() }
        })
      }
    })

    // ====== 初始化 ======
    loadQuotes()
    loadRandomBackground()
  </script>

</body>
</html>
